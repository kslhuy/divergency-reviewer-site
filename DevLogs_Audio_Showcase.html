    const items = [{"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_practice_loop", "file_name": "mus_devlogs_practice_loop.wav", "target": "32 bars, 64 seconds at 120 BPM", "prompt": "Original instrumental music loop for a pixel-art arcade brawler's combat practice room in a damp industrial sewer. 120 BPM, 4/4, D minor. Restrained analog bass pulse, light syncopated breakbeat, muted metallic percussion, sparse two-note FM synth motif, quiet atmospheric harmony. Focused, gritty, curious and slightly tense, comfortable during repeated practice. Low musical density with space for weapon impacts and command cues. Stable groove from the first bar, 32-bar cyclic arrangement, no introduction, no final cadence, no fade-out. No vocals, choir, spoken words, sound effects, literal water sounds, gunshots, or cinematic trailer booms. End harmonically and rhythmically ready to return to bar one.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_combat_loop", "file_name": "mus_devlogs_combat_loop.wav", "target": "32 bars, 64 seconds", "prompt": "Original instrumental combat loop for a fast pixel-art sewer brawler. 120 BPM, 4/4, D minor. Tight energetic breakbeat, punchy controlled bass, short rhythmic synth stabs, restrained metallic percussion, and a memorable sparse motif. Street-level determination and forward movement, medium-high energy without frantic treble or oversized bass. Preserve room for arrows, rifle shots, blade hits and ally commands. Keep the same musical palette and motif as the supplied practice reference if provided. Consistent 32-bar cyclic arrangement; no long build, dramatic silence, ending cadence, intro, outro, vocals, environmental recordings, combat effects, or trailer impacts. Seamless return to the opening groove.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_bigmm_loop", "file_name": "mus_devlogs_bigmm_loop.wav", "target": "32 bars, 64 seconds", "prompt": "Original instrumental boss combat loop for a large aggressive sewer enforcer in a pixel-art brawler. 120 BPM, 4/4, D minor. Weighty syncopated bass, firmer breakbeat, low tom accents, rough restrained synth growl and a threatening variation of the supplied combat motif if available. More pressure and authority than ordinary combat while keeping the same tempo. No constant risers or orchestral wall of sound. Leave openings for attack telegraphs and short boss taunts. 32-bar loop with stable intensity and compatible loop boundaries. No vocals, choir, sound effects, gunshots, giant cinematic booms, fade-out or final cadence.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_boss_release", "file_name": "mus_devlogs_boss_release.wav", "target": "1–2 seconds", "prompt": "One original short instrumental boss engagement accent in D minor at 120 BPM: a low tom strike and compact dark synth chord, a brief upward tension movement, then a clean short tail. Threatening and decisive, suitable over a continuing electronic combat groove. No voice, explosion, trailer boom, long riser, or second musical phrase. Keep the midrange sparse so the final boss taunt remains understandable.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_victory", "file_name": "mus_devlogs_victory.wav", "target": "4–6 seconds", "prompt": "Original short instrumental victory cue for a gritty arcade sewer fight, 120 BPM. Resolve the D minor combat motif toward a warm D major ending with restrained synth notes, one compact drum fill and a satisfying bass resolution. Earned relief, confident but modest. No orchestral fanfare, applause, vocals, game sound effects, or long sustain. One clear ending with a complete natural tail.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_defeat", "file_name": "mus_devlogs_defeat.wav", "target": "3–4 seconds", "prompt": "Original short instrumental defeat cue for an arcade combat practice room. A subdued descending three-note synth figure in D minor, soft low percussion, and a brief unresolved bass decay. Clear setback without tragedy, mockery or horror. Leave space for a retry interface. No voice, heartbeat alarm, cinematic boom, game effects or long ending.", "type": "music"}, {"category": "Music", "section": "Music prompts", "stem": "mus_devlogs_start", "file_name": "mus_devlogs_start.wav", "target": "1 second", "prompt": "One original short instrumental combat-start accent at 120 BPM in D minor: a tight two-beat metallic percussion pickup and a restrained bass pulse, ready to hand off to a continuous electronic groove. Alert and purposeful, no melody fanfare, voice, alarm or explosion. Complete compact tail.", "type": "music"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_step_concrete", "file_name": "sfx_step_concrete.wav", "target": "0.18 s", "prompt": "One boot footfall on damp rough concrete: firm rubber sole contact, tiny grit scrape, dry low-mid body, no splash.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_step_metal", "file_name": "sfx_step_metal.wav", "target": "0.22 s", "prompt": "One boot footfall on a heavy steel walkway: a tight shoe thud and short muted plate resonance, no exaggerated hollow clang.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_step_water", "file_name": "sfx_step_water.wav", "target": "0.25 s", "prompt": "One boot footfall through ankle-deep water over concrete: compact shallow splash, firm sole contact and a few falling droplets.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_jump_takeoff", "file_name": "sfx_jump_takeoff.wav", "target": "0.2 s", "prompt": "One athletic jump push-off: short rubber scrape and compact clothing swish, no landing or vocal effort.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_land_concrete", "file_name": "sfx_land_concrete.wav", "target": "0.35 s", "prompt": "One two-foot landing on damp concrete: rounded shoe thump, brief gritty contact and small clothing movement.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_land_metal", "file_name": "sfx_land_metal.wav", "target": "0.4 s", "prompt": "One two-foot landing on a heavy steel platform: weighty boot contact and a short controlled sheet-metal resonance.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_land_water", "file_name": "sfx_land_water.wav", "target": "0.5 s", "prompt": "One two-foot landing in shallow water: broad compact splash over a low foot impact, then short falling droplets.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_dash", "file_name": "sfx_dash.wav", "target": "0.22 s", "prompt": "One fast athletic dash: compact low air displacement, a tight cloth snap and very short sole scrape, no magical teleport sound.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_roll", "file_name": "sfx_roll.wav", "target": "0.45 s", "prompt": "One quick evasive body roll on rough concrete: tight cloth brush and soft sequential body contact within a single compact rolling movement.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_body_fall", "file_name": "sfx_body_fall.wav", "target": "0.45 s", "prompt": "One clothed fighter falls onto concrete: weighty low body thud and brief fabric skid, no bone crack or voice.", "type": "sfx"}, {"category": "Movement", "section": "Movement and physical reactions", "stem": "sfx_body_wall", "file_name": "sfx_body_wall.wav", "target": "0.35 s", "prompt": "One clothed body strikes a solid concrete wall:     let activeCategory = "ALL";
    let searchQuery = "";

    async function refreshStatus() {
      try {
        const res = await fetch('scripts/batch_status.json?t=' + Date.now());
        if (res.ok) {
          batchStatus = await res.json();
          renderCards();
          updateStats();
        }
      } catch (e) {}
    }

    function initCategories() {
      const cats = ["ALL"];
      items.forEach(it => {
        if (!cats.includes(it.category)) cats.push(it.category);
      });

      const tabsContainer = document.getElementById("categoryTabs");
      tabsContainer.innerHTML = cats.map(cat => {
        const count = cat === "ALL" ? items.length : items.filter(i => i.category === cat).length;
        return `<button class="tab-btn ${cat === 'ALL' ? 'active' : ''}" onclick="setCategory('${cat}')">${cat} (${count})</button>`;
      }).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.textContent.startsWith(cat + " "));
      });
      renderCards();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderCards();
    });

    function updateStats() {
      let ready = 0;
      items.forEach(it => {
        if (batchStatus[it.stem] && batchStatus[it.stem].status === "success") {
          ready++;
        }
      });
      document.getElementById("readyCount").textContent = ready;
    }

    function renderCards() {
      const grid = document.getElementById("catalogGrid");
      const filtered = items.filter(it => {
        const matchCat = (activeCategory === "ALL" || it.category === activeCategory);
        const matchSearch = !searchQuery || 
          it.stem.toLowerCase().includes(searchQuery) ||
          it.prompt.toLowerCase().includes(searchQuery) ||
          it.category.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">Không tìm thấy âm thanh phù hợp với từ khóa "${searchQuery}"</div>`;
        return;
      }

      grid.innerHTML = filtered.map(it => {
        const st = batchStatus[it.stem] || {};
        const isReady = st.status === "success";
        const dotClass = isReady ? "dot-ready" : (st.status === "failed" ? "dot-failed" : "dot-pending");
        const statusText = isReady ? `Sẵn sàng (${st.size_kb || '?'} KB)` : (st.status === "failed" ? "Lỗi sinh" : "Đang tạo / Chờ lượt");
        const audioSrc = `content/gameplay/audio/${it.file_name}`;
        const unityPath = `C:/Users/Quang Huy Nugyen/LF2Revie/Assets/Sound/DevLogs/${it.category}/${it.file_name}`;

        return `
          <div class="audio-card">
            <div>
              <div class="card-top">
                <span class="cat-badge cat-${it.category}">${it.category}</span>
                <span class="dur-badge">${it.target}</span>
              </div>
              <div class="stem-title">${it.file_name}</div>
              <div class="prompt-text" title="Bấm để mở rộng prompt" onclick="this.classList.toggle('expanded')">${it.prompt}</div>
            </div>

            <div class="player-area">
              <audio controls preload="none">
                <source src="${audioSrc}" type="audio/wav">
                Trình duyệt của bạn không hỗ trợ audio element.
              </audio>
              <div class="card-footer">
                <div class="status-indicator">
                  <span class="dot ${dotClass}"></span>
                  <span style="color: ${isReady ? '#10b981' : '#94a3b8'};">${statusText}</span>
                </div>
                <a class="open-btn" href="${audioSrc}" target="_blank" download title="Tải file WAV">
                  <span>⬇ WAV</span>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    initCategories();
    renderCards();
    updateStats();

    // Poll status every 4 seconds to update real-time
    setInterval(refreshStatus, 4000);
  </script>
