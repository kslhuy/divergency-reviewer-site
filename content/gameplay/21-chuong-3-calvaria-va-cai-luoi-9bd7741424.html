<h2 id="gameplay-chuong-3-calvaria-va-cai-luoi" tabindex="-1"><a class="heading-link" href="#gameplay-chuong-3-calvaria-va-cai-luoi" aria-label="Link to section">#</a>Chương 3 – Calvaria và Cái Lưỡi</h2>
<p>Chương này phát triển theo chuỗi <strong>tiếng gọi → tên riêng → mệnh lệnh → lời người chết → quyền từ chối</strong>. Không gian chuyển từ con đường vắng sang một nền kinh tế xây trên cái chết, rồi kết thúc tại nơi giọng nói trở thành vũ khí.</p>
