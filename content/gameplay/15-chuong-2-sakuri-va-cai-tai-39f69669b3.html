<h2 id="gameplay-chuong-2-sakuri-va-cai-tai" tabindex="-1"><a class="heading-link" href="#gameplay-chuong-2-sakuri-va-cai-tai" aria-label="Link to section">#</a>Chương 2 – Sakuri và Cái Tai</h2>
<p>Chương này phát triển từ <strong>nghe môi trường → điều khiển tiếng động → phá thói quen → đối mặt với kẻ nghe được ý nghĩ</strong>. Sakuri đáng thương nhiều hơn độc ác: Cái Tai khiến cô phải nghe máu, bệnh, lời nói dối và ham muốn của người khác quá lâu.</p>
